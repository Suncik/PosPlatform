<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosPlatform — Kirish</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .login-card { 
            background-color: white; 
            padding: 40px 30px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            text-align: center; 
        }
        .logo-box { margin-bottom: 20px; }
        .logo-box img { width: 80px; }
        h1 { color: #1d4ed8; font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; color: #1e3a8a; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        .input-group input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            color: black;
            outline: none; 
        }
        .input-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background-color: #1d4ed8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        .btn-submit:hover { background-color: #1e40af; }
        .footer-text { margin-top: 25px; color: #94a3b8; font-size: 12px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">
            <span style="font-size: 50px;">☁️</span>
        </div>
        <h1>PosPlatform</h1>
        <p>Hisobingizga kiring</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Foydalanuvchi nomi</label>
                <input type="text" id="username" placeholder="login" required>
            </div>
            <div class="input-group">
                <label>Parol</label>
                <input type="password" id="password" placeholder="parol" required>
            </div>
            <button type="submit" class="btn-submit">Kirish</button>
        </form>

        <div class="footer-text">© PosPlatform — savdo boshqaruv tizimi</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();  
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
    
            // Yangi yaratilgan WebLoginView API manziliga POST so'rovi yuboramiz
            fetch('/api/auth/web-login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') // Django xavfsizlik tokeni
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            })
            .then(response => {
                if (!response.ok) {
                    // Agar login/parol xato bo'lsa yoki 400 xato kelsa
                    return response.json().then(err => { throw new Error(err.error || "Login yoki parol xato!"); });
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    // Backend qaytargan manzilga yo'naltirish (/dashboard/ yoki /pos/)
                    window.location.href = data.redirect_to;
                } else {   
                    alert(data.error || "Xatolik yuz berdi!");
                }
            })
            .catch(err => {
                alert(err.message || "Tizimga ulanishda xatolik yuz berdi!");
                console.error(err);
            });
        });
    
        // CSRF tokenni brauzerdan o'qish uchun yordamchi funksiya (Django talabi)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>

</body>
</html>
